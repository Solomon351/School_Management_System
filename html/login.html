<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – Educanize School Management</title>
    <link rel="stylesheet" href="../css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-text min-h-screen flex flex-col font-sans antialiased selection:bg-primary/20 selection:text-primary transition-colors">
    <!-- Main Content -->
    <div class="w-full flex flex-col items-center justify-center flex-1 px-4 sm:px-6 lg:px-8 border-b border-border">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center">
                <h2 class="mt-6 text-3xl font-extrabold text-text">Log in to your account</h2>
                <p class="mt-2 text-sm text-text/70">Don't have an account? <a href="register.html" class="font-medium text-primary hover:text-primary/80">Sign up</a></p>
            </div>
            <form class="mt-8 space-y-6" action="#" method="POST">
                <input type="hidden" name="remember" value="true">
                <div class="-space-y-px rounded-md shadow-sm">
                    <div>
                        <label for="email-address" class="sr-only">Email address</label>
                        <input id="email-address" name="email" type="email" autocomplete="email" required class="relative block w-full rounded-t-md border border-border bg-bg px-3 py-2 text-text placeholder:text-text/50 focus:z-10 focus:border-primary focus:ring-primary sm:text-sm" placeholder="Email address">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required class="relative block w-full rounded-b-md border border-border bg-bg px-3 py-2 text-text placeholder:text-text/50 focus:z-10 focus:border-primary focus:ring-primary sm:text-sm" placeholder="Password">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-border text-primary focus:ring-primary">
                        <label for="remember-me" class="ml-2 block text-sm text-text">Remember me</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-primary hover:text-primary/80">Forgot your password?</a>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative flex w-full justify-center> rounded-md border border-transparent bg-primary py-2 px-4 text-sm font-medium text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                        Log In
                    </button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
