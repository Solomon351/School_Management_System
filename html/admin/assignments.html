<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Assignments – Educanize School Management</title>
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8" data-assignments-page>
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Assignments</h1>
            <p class="mt-1 text-sm text-muted">Homework &amp; submissions</p>
          </div>
          <button id="assignment-create" type="button"
            class="inline-flex h-10 items-center justify-center gap-2 rounded-input bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
            <span aria-hidden="true">＋</span>
            Create Assignment
          </button>
        </div>

        <p id="assignment-feedback" class="mb-4 hidden rounded-input border border-border bg-card px-4 py-3 text-sm text-muted" role="status" aria-live="polite"></p>

        <div class="overflow-hidden rounded-card border border-border bg-card shadow-sm transition-colors anim-fade-up">
          <div id="assignment-empty" class="p-5 text-sm text-muted" role="status" aria-live="polite">
            No assignments are available. Assignment data will appear here when it is provided.
          </div>
          <div id="assignment-table" class="hidden min-w-0">
            <div class="max-w-full overflow-x-auto">
              <table class="w-full min-w-140 border-collapse text-left">
                <caption class="sr-only">Assignments</caption>
                <thead class="bg-bg text-xs font-semibold uppercase tracking-wide text-muted">
                  <tr>
                    <th scope="col" class="px-4 py-3">Title</th>
                    <th scope="col" class="px-4 py-3">Class</th>
                    <th scope="col" class="px-4 py-3">Due</th>
                    <th scope="col" class="px-4 py-3">Submissions</th>
                    <th scope="col" class="px-4 py-3">Status</th>
                  </tr>
                </thead>
                <tbody id="assignment-rows" class="divide-y divide-border"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-assignments.js"></script>
</body>
</html>
