<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Attendance – Educanize School Management</title>
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8" data-attendance-page>
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Attendance</h1>
            <p class="mt-1 text-sm text-muted">Daily attendance register</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button id="attendance-cancel" type="button"
              class="hidden h-10 items-center justify-center rounded-input border border-border px-4 py-2 text-sm font-semibold text-text hover:bg-card focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
              Cancel
            </button>
            <button id="attendance-action" type="button"
              class="inline-flex h-10 items-center justify-center gap-2 rounded-input bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50"
              disabled>
              <span id="attendance-action-icon" aria-hidden="true">＋</span>
              <span id="attendance-action-label">Take Attendance</span>
            </button>
          </div>
        </div>

        <div class="overflow-hidden rounded-card border border-border bg-card shadow-sm transition-colors">
          <div class="flex flex-col gap-3 border-b border-border p-4 sm:flex-row sm:flex-wrap sm:items-end sm:p-5">
            <label class="flex min-w-0 flex-1 flex-col gap-1 text-xs font-medium text-muted sm:min-w-40">
              <span>Class</span>
              <select id="attendance-class" aria-label="Filter attendance by class"
                class="h-10 w-full rounded-input border border-border bg-bg px-3 text-sm text-text focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
                <option value="all">All classes</option>
              </select>
            </label>
            <label class="flex min-w-0 flex-1 flex-col gap-1 text-xs font-medium text-muted sm:min-w-40">
              <span>Date</span>
              <input id="attendance-date" type="date" aria-label="Attendance date"
                class="h-10 w-full rounded-input border border-border bg-bg px-3 text-sm text-text focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
            </label>
            <label class="flex min-w-0 flex-1 flex-col gap-1 text-xs font-medium text-muted sm:min-w-40">
              <span>Status</span>
              <select id="attendance-status-filter" aria-label="Filter attendance by status"
                class="h-10 w-full rounded-input border border-border bg-bg px-3 text-sm text-text focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
                <option value="all">All statuses</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
              </select>
            </label>
          </div>

          <p id="attendance-feedback" class="hidden border-b border-border px-4 py-3 text-sm text-success sm:px-5" role="status" aria-live="polite"></p>
          <div id="attendance-empty" class="p-5 text-sm text-muted" role="status" aria-live="polite">
            No attendance records are available. Attendance data will appear here when it is provided.
          </div>
          <div id="attendance-table" class="hidden min-w-0">
            <div class="max-w-full overflow-x-auto">
              <table class="w-full min-w-160 border-collapse text-left">
                <caption class="sr-only">Daily student attendance register</caption>
                <thead class="bg-bg text-xs font-semibold uppercase tracking-wide text-muted">
                  <tr>
                    <th scope="col" class="px-4 py-3">Student</th>
                    <th scope="col" class="px-4 py-3">Class</th>
                    <th scope="col" class="px-4 py-3">Mon</th>
                    <th scope="col" class="px-4 py-3">Tue</th>
                    <th scope="col" class="px-4 py-3">Wed</th>
                    <th scope="col" class="px-4 py-3">Today</th>
                  </tr>
                </thead>
                <tbody id="attendance-rows" class="divide-y divide-border"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-attendance.js"></script>
</body>
</html>
