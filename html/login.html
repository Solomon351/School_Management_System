<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – Educanize School Management</title>
    <link rel="stylesheet" href="../css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-text min-h-screen flex flex-col font-sans antialiased selection:bg-primary/20 selection:text-primary transition-colors">

    <!-- Mobile Brand Header (Visible only under 760px) -->
    <header class="md:hidden lg:flex bg-navy text-white px-5 py-4 flex items-center justify-between border-b border-white/10 anim-fade-up-8">
        <div class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
            <span class="text-2xl" aria-hidden="true">🎓</span>
            <span>Educ<span class="text-[#22c55e]">anize</span></span>
        </div>
        <a href="#" class="text-xs font-semibold text-white/80 lg:hidden hover:text-white transition-colors bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-input">
         Sign In
        </a>
    </header>
    <!-- Main Content -->
    <div class="w-full flex flex-col  items-center justify-center flex-1 px-4 sm:px-6 lg:px-8 ">

        <div class="w-full max-w-md space-y-8 border border-white/10 bg-card rounded-card p-6 sm:p-9 shadow-sm transition-colors anim-card" style="--delay: 500ms;">
            <div class="text-center">
                <h2 class="mt-6 text-3xl font-extrabold text-text">Log in to your account</h2>
                <p class="mt-2 text-sm text-text/70">Don't have an account? <a href="../signup.html" class="font-medium text-primary hover:text-primary/80">Sign up</a></p>
            </div>
            <form class="mt-8 space-y-6" action="#" method="POST">
                <input type="hidden" name="remember" value="true">
                <div class="-space-y-px rounded-md shadow-sm flex flex-col gap-6">
                    <div>
                        <label for="email-address" class="sr-only">Email address</label>
                        <input id="email-address" name="email" type="email" autocomplete="email" required class="w-full px-3.5 py-2.5 rounded-input border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-muted/60"
                         aria-required="true" placeholder="Email address">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full px-3.5 py-2.5 rounded-input border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-muted/60"
                        aria-required="true" placeholder="Password">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-border text-primary focus:ring-primary">
                        <label for="remember-me" class="ml-2 block text-sm text-text">Remember me</label>
                    </div>

                    <div class="text-lg">
                        <a href="#" class="font-medium text-primary hover:text-primary/80">Forgot your password?</a>
                    </div>
                </div>

                <div class="flex items-center justify-center">
                    <button type="submit" class="group relative flex w-full justify-center rounded-md border border-transparent bg-primary py-2 px-6 text-lg font-medium text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ">
                        Log In
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Shared Site Footer Container (Populated via js/footer.js) -->
    <div id="site-footer"></div>

    <!-- Shared Footer Script -->
    <script src="../js/footer.js"></script>
    
</body>
</html>
