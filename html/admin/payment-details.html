<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Payment Details – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8">
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Payment Details</h1>
            <p class="mt-1 text-sm text-muted">View payment information</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="print-button" type="button" class="inline-flex h-10 items-center justify-center rounded-input border border-border bg-card px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
              Print
            </button>
            <a id="back-to-fees" href="./fees.html" class="inline-flex h-10 items-center justify-center rounded-input border border-border bg-card px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
              Back to Fees
            </a>
          </div>
        </div>

        <div id="payment-loading" class="rounded-card border border-border bg-card p-6 text-sm text-muted shadow-sm" role="status" aria-live="polite">
          Loading payment details...
        </div>
        <div id="payment-error" class="hidden rounded-card border border-danger bg-card p-6 text-sm text-danger shadow-sm" role="alert"></div>
        <div id="payment-empty" class="hidden rounded-card border border-border bg-card p-6 text-sm text-muted shadow-sm" role="status" aria-live="polite">
          No payment receipt is selected. Open a payment from the Fees list to view its details.
        </div>

        <div id="payment-content" class="hidden space-y-4 anim-fade-up">
          <article class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors sm:p-6">
            <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
              <div class="min-w-0 flex-1">
                <h2 class="break-words text-xl font-bold text-text">Receipt #<span id="payment-receipt"></span></h2>
                <p class="mt-1 text-sm text-muted">Status: <span id="payment-status"></span></p>
              </div>
              <div id="payment-amount-display" class="text-2xl font-bold text-text"></div>
              <p class="mt-1 text-sm text-muted">Balance remaining after payment: <span id="payment-balance-remaining" class="font-semibold text-text"></span></p>
            </div>
          </article>

          <div class="grid min-w-0 gap-4 md:grid-cols-2">
            <section class="min-w-0 rounded-card border border-border bg-card p-5 shadow-sm transition-colors sm:p-6" aria-labelledby="payment-info-heading">
              <h3 id="payment-info-heading" class="mb-3 text-base font-semibold text-text">Payment Information</h3>
              <dl id="payment-info-details" class="divide-y divide-border"></dl>
            </section>
            <section class="min-w-0 rounded-card border border-border bg-card p-5 shadow-sm transition-colors sm:p-6" aria-labelledby="student-info-heading">
              <h3 id="student-info-heading" class="mb-3 text-base font-semibold text-text">Student Information</h3>
              <dl id="student-info-details" class="divide-y divide-border"></dl>
            </section>
          </div>
        </div>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/fees-demo-data.js"></script>
  <script src="../../js/admin-payment-details.js"></script>
</body>
</html>
