<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Educanize – School Management</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f2;--side:#0a1b4d;--pri:#2563eb;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mut:#93a0ba;--bd:#25304d;--side:#060d26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mut:#93a0ba;--bd:#25304d;--side:#060d26;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px;display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#cbd5f5;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.logo{color:#fff;font-weight:800;font-size:20px;padding:6px 10px 16px}.logo span{color:#22c55e}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#cbd5f5;cursor:pointer;margin-bottom:2px}
nav a:hover{background:#ffffff14}nav a.on{background:var(--pri);color:#fff}
.up{margin-top:14px;background:#ffffff12;border-radius:12px;padding:12px;font-size:12px}
.up button{margin-top:8px;width:100%;background:var(--ok);color:#fff;border:0;border-radius:8px;padding:9px;font-weight:600}
main{flex:1;min-width:0;padding:0 22px 30px}
header{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
header input{flex:1;max-width:380px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.sp{flex:1}.av{display:flex;gap:8px;align-items:center}.av i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:block}
#menu{display:none;background:none;border:0;font-size:22px;color:var(--tx)}
h1{margin:6px 0 2px;font-size:24px}.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{display:block;font-size:24px;margin:4px 0}.stat small{color:var(--mut)}.stat em{font-style:normal;color:var(--ok);font-size:12px}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:18px}
h3{margin:0 0 12px;font-size:15px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.sc{overflow-x:auto}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.t-ok{background:#16a34a22;color:var(--ok)}.t-warn{background:#f59e0b22;color:var(--warn)}.t-bad{background:#dc262622;color:var(--bad)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.act{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}.act small{color:var(--mut);display:block}
.qa{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.qa div{text-align:center;padding:14px 6px;border-radius:12px;background:var(--bg);font-size:12px;cursor:pointer}.qa span{font-size:24px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cal b{color:var(--mut)}.cal i{font-style:normal;padding:5px 0;border-radius:50%}.cal .d{background:var(--pri);color:#fff}
.tt td{text-align:center}.tt td.c{background:#2563eb18;border-radius:6px}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri)}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}form.f label{display:grid;gap:4px;color:var(--mut);font-size:12px}form.f input,form.f select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
@media(max-width:1000px){.g5{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.qa{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){aside{position:fixed;z-index:20;left:-250px;transition:.2s}aside.open{left:0}#menu{display:block}form.f{grid-template-columns:1fr}}
#lg{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}#lg .card{width:100%;max-width:400px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--tx)}.tabs button.on{background:var(--pri);color:#fff}#lg input{width:100%;padding:11px;margin-bottom:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
</style></head><body>
<aside id="sd"><div class="logo">🎓 Educ<span>anize</span></div><nav id="nav"></nav>
<div class="up"><b>★ Upgrade to Premium</b><br>Unlock more powerful features.<button>Upgrade Now</button></div></aside>
<main><header><button id="menu">☰</button><input placeholder="Search anything…"><div class="sp"></div>🔔 ✉️<div class="av"><i></i><div id="who">John Doe<br><small style="color:var(--mut)">Super Admin</small></div></div></header>
<div id="v"></div></main>
<div id="lg"><div class="card"><div class="logo" style="color:var(--tx);padding:0">🎓 Educ<span>anize</span></div><div class="sub" style="margin:4px 0 0">Sign in to your school portal</div><div class="tabs"><button id="t1" class="on" onclick="setRole('admin')">Admin</button><button id="t2" onclick="setRole('student')">Student</button><button id="t3" onclick="setRole('teacher')">Teacher</button><button id="t4" onclick="setRole('parent')">Parent</button></div><input id="lid" placeholder="Email address"><input type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="login()">Sign In</button><p style="color:var(--mut);font-size:12px;text-align:center">Demo: tap Sign In with any details</p></div></div>
<script>
const P=[["Dashboard","🏠"],["Students","🎓"],["Teachers","👩‍🏫"],["Parents","👪"],["Academics","📚"],["Attendance","✅"],["Examinations","📝"],["Assignments","📎"],["Fees & Payments","💳"],["Timetable","🗓️"],["Library","📖"],["Transport","🚌"],["Hostel","🏨"],["Reports","📊"],["Scratch Cards","🎟️"],["Notices","📣"],["Settings","⚙️"]];
const tg=(t)=>`<span class="tag ${/Paid|Active|Present|Published|Submitted|On Time|Available|Done/.test(t)?'t-ok':/Pending|Partial|Late|Draft|Issued/.test(t)?'t-warn':'t-bad'}">${t}</span>`;
const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(c=>`<td>${/^(Paid|Active|Present|Absent|Pending|Partial|Overdue|Late|Published|Draft|Submitted|Issued|Available|Done|Inactive)$/.test(c)?tg(c):c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const page=(t,s,btn,body)=>`<div class="bar"><div><h1>${t}</h1><div class="sub">${s}</div></div>${btn?`<button class="btn" onclick="go('${btn}')">＋ ${btn}</button>`:''}</div>${body}`;
const stat=(i,c,l,v,d)=>`<div class="card stat"><div class="ic" style="background:${c}">${i}</div><small>${l}</small><b>${v}</b><em>${d}</em></div>`;
const S=["Mary Johnson","James Okoro","Amina Bello","David Brown","Grace Eze","Tunde Ade"];
const pts=[25,44,65,60,77,72,90,84];
const chart=()=>{const p=pts.map((y,i)=>`${30+i*80},${190-y*1.8}`).join(' ');return`<svg viewBox="0 0 620 210" style="width:100%"><polyline points="30,190 ${p} 590,190" fill="#2563eb18"/><polyline points="${p}" fill="none" stroke="#2563eb" stroke-width="3"/>${["Mon","Tue","Wed","Thu","Fri","Sat","Sun","—"].slice(0,7).map((d,i)=>`<text x="${30+i*80}" y="206" font-size="11" fill="#64748b" text-anchor="middle">${d}</text>`).join('')}</svg>`};
const cal=()=>{let h=["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>`<b>${d}</b>`).join('');for(let i=0;i<4;i++)h+='<i></i>';for(let d=1;d<=31;d++)h+=`<i class="${d==13?'d':''}">${d}</i>`;return`<div class="cal">${h}</div>`};
const V={
"Dashboard":()=>`<h1>Dashboard</h1><div class="sub">Welcome back, John! 👋</div><div class="grid g5">${stat("🎓","#2563eb","Total Students","1,245","↑ 12 this month")}${stat("👩‍🏫","#16a34a","Total Teachers","86","↑ 8 this month")}${stat("✅","#3b82f6","Attendance Today","92%","↑ 5%")}${stat("💳","#22c55e","Fees Collection","₦2,450,000","↑ 18% this month")}${stat("👪","#8b5cf6","Parents","1,102","↑ 10 this month")}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Attendance Overview</h3>${chart()}</div><div class="card"><h3>Recent Activities</h3>${[["🧑‍🎓","New Student Admission","Mary Johnson was admitted","10:30 AM"],["💸","Fee Payment Received","₦25,000 by James Okoro","09:15 AM"],["📄","Assignment Submitted","Physics – Class 10A","Yesterday"],["👨‍🏫","Teacher Added","Mr. David Brown joined","Yesterday"]].map(a=>`<div class="act"><span>${a[0]}</span><div style="flex:1"><b>${a[1]}</b><small>${a[2]}</small></div><small>${a[3]}</small></div>`).join('')}</div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Quick Actions</h3><div class="qa">${[["🧑‍🎓","Add Student"],["✅","Take Attendance"],["📝","Create Assignment"],["💰","Collect Fees"],["📊","Generate Report"],["📣","Send Notice"]].map(a=>`<div onclick="go(QA['${a[1]}'])"><span>${a[0]}</span>${a[1]}</div>`).join('')}</div></div><div class="card"><h3>Calendar – October 2026</h3>${cal()}</div></div>`,
"Students":()=>page("Students","Manage all enrolled students","Add Student",`<div class="card">${tbl(["ID","Name","Class","Gender","Parent","Status",""],S.map((n,i)=>["STU-00"+(i+1),n,["JSS1A","JSS2B","SS1A","SS2C","SS3A","JSS3B"][i],i%2?"Male":"Female","Parent of "+n.split(' ')[0],i==4?"Inactive":"Active","<button class='btn' onclick=\"go('Profile')\">View</button>"]))}</div>`),
"Teachers":()=>page("Teachers","Staff directory","Add Teacher",`<div class="grid g3">${["Mr. David Brown|Physics","Mrs. Ada Obi|Mathematics","Mr. Sam Yusuf|English","Ms. Ife Bello|Biology","Mr. Chi Eze|Chemistry","Mrs. Zainab Musa|Civic"].map(t=>{t=t.split('|');return`<div class="card"><div class="ic" style="background:#16a34a">👩‍🏫</div><h3 style="margin-top:10px">${t[0]}</h3><small style="color:var(--mut)">${t[1]} · 5 classes</small></div>`}).join('')}</div>`),
"Parents":()=>page("Parents","Guardians linked to students","Add Parent",`<div class="card">${tbl(["Name","Phone","Children","Outstanding Fees"],[["James Okoro","0803 000 0001","2","₦0"],["Mrs. Johnson","0803 000 0002","1","₦45,000"],["Mr. Bello","0803 000 0003","3","₦120,000"]])}</div>`),
"Academics":()=>page("Academics","Classes, subjects & sessions","Add Class",`<div class="grid g3">${["JSS1|4 arms|120 students","JSS2|4 arms|118 students","JSS3|3 arms|96 students","SS1|4 arms|130 students","SS2|3 arms|102 students","SS3|3 arms|98 students"].map(c=>{c=c.split('|');return`<div class="card"><h3>${c[0]}</h3><small style="color:var(--mut)">${c[1]} · ${c[2]}</small><div class="prog" style="margin-top:12px"><i style="width:${60+c[0].length*7}%"></i></div></div>`}).join('')}</div>`),
"Attendance":()=>page("Attendance","Daily attendance register","Take Attendance",`<div class="card">${tbl(["Student","Class","Mon","Tue","Wed","Today"],S.map((n,i)=>[n,"SS1A","Present","Present",i==2?"Absent":"Present",i==3?"Late":"Present"]))}</div>`),
"Examinations":()=>page("Examinations & Results","Exams, results & scratch cards","Create Exam",`<div class="grid g2"><div class="card"><h3>Exam Schedule</h3>${tbl(["Exam","Class","Date","Status"],[["Mathematics","SS1","Nov 3","Published"],["English","SS1","Nov 5","Draft"],["Physics","SS2","Nov 8","Draft"]])}</div><div class="card"><h3>Result Scratch Cards</h3><form class="f"><label>Session<select><option>2026/2027</option></select></label><label>Term<select><option>First</option></select></label><label>Quantity<input value="50"></label><label>Price (₦)<input value="1000"></label></form><br><button class="btn">Generate Cards</button><br><br>${tbl(["PIN","Serial","Status"],[["••••-4821","SC001","Available"],["••••-9930","SC002","Done"],["••••-1175","SC003","Available"]])}</div></div><div class="card" style="margin-top:14px"><h3>Student Result Check</h3><form class="f"><label>Reg. Number<input placeholder="STU-0001"></label><label>Scratch PIN<input placeholder="Enter PIN"></label></form><br><button class="btn">Check Result</button></div>`),
"Assignments":()=>page("Assignments","Homework & submissions","Create Assignment",`<div class="card">${tbl(["Title","Class","Due","Submissions","Status"],[["Physics Assignment","10A","Nov 2","32/40","Published"],["Essay: My School","JSS2","Nov 4","18/36","Pending"],["Algebra Set 3","SS1","Nov 6","40/40","Done"]])}</div>`),
"Fees & Payments":()=>page("Fees & Payments","Collect and track school fees","Collect Fees",`<div class="grid g3">${stat("💰","#16a34a","Collected","₦2,450,000","↑ 18%")}${stat("⏳","#f59e0b","Pending","₦640,000","23 students")}${stat("⚠️","#dc2626","Overdue","₦180,000","8 students")}</div><div class="card" style="margin-top:14px"><h3>Transactions</h3>${tbl(["Receipt","Student","Amount","Method","Status"],[["RC-101","James Okoro","₦25,000","Card","Paid"],["RC-102","Mary Johnson","₦45,000","Transfer","Pending"],["RC-103","Amina Bello","₦60,000","Card","Partial"],["RC-104","Tunde Ade","₦80,000","Cash","Overdue"]])}</div>`),
"Timetable":()=>{const d=["Mon","Tue","Wed","Thu","Fri"],s=["Math","English","Physics","Biology","Civic","Chem"];return page("Timetable","Weekly class schedule","Edit",`<div class="card sc"><table class="tt"><tr><th></th>${d.map(x=>`<th>${x}</th>`).join('')}</tr>${["8:00","9:00","10:00","11:00","12:00"].map((t,r)=>`<tr><th>${t}</th>${d.map((_,c)=>`<td class="c">${s[(r+c)%6]}</td>`).join('')}</tr>`).join('')}</table></div>`)},
"Library":()=>page("Library","Books & borrowing","Add Book",`<div class="card">${tbl(["Title","Author","Borrower","Due","Status"],[["Things Fall Apart","C. Achebe","Grace Eze","Nov 1","Issued"],["Physics Made Easy","T. Ola","—","—","Available"],["Pride & Prejudice","J. Austen","Tunde Ade","Oct 10","Overdue"]])}</div>`),
"Transport":()=>page("Transport","Routes, buses & drivers","Add Route",`<div class="card">${tbl(["Route","Bus","Driver","Students","Status"],[["Lekki – School","BUS-01","Mr. Kola","38","Active"],["Ikeja – School","BUS-02","Mr. Dayo","41","Active"],["Yaba – School","BUS-03","Mr. Femi","0","Inactive"]])}</div>`),
"Hostel":()=>page("Hostel","Rooms & allocations","Allocate Room",`<div class="grid g3">${["Block A|Boys|92/100","Block B|Girls|80/90","Block C|Boys|40/60"].map(b=>{b=b.split('|');return`<div class="card"><h3>${b[0]} · ${b[1]}</h3><small style="color:var(--mut)">Occupancy ${b[2]}</small><div class="prog" style="margin-top:10px"><i style="width:${eval(b[2])*100}%"></i></div></div>`}).join('')}</div>`),
"Reports":()=>page("Reports","Generate & download reports","",`<div class="grid g3">${["Student Report","Attendance Report","Fees Report","Results Summary","Teacher Report","Library Report"].map(r=>`<div class="card"><h3>📄 ${r}</h3><button class="btn">Generate</button></div>`).join('')}</div>`),
"Settings":()=>page("Settings","School profile & preferences","",`<div class="card"><form class="f"><label>School Name<input value="Educanize Academy"></label><label>Session<select><option>2026/2027</option></select></label><label>Email<input placeholder="info@school.com"></label><label>Phone<input placeholder="080…"></label></form><br><button class="btn">Save Changes</button></div>`)};
const nav=document.getElementById('nav'),v=document.getElementById('v'),sd=document.getElementById('sd');
function go(n){if(!V[n])return;v.innerHTML=V[n]();[...nav.children].forEach(a=>a.classList.toggle('on',a.dataset.n==n));sd.classList.remove('open');scrollTo(0,0)}

document.getElementById('menu').onclick=()=>sd.classList.toggle('open');
const ST=[["My Profile","👤"],["My Results","📝"],["Pay Fees","💳"],["Timetable","🗓️"],["Logout","🚪"]];
function buildNav(L){nav.innerHTML='';L.forEach(p=>{const a=document.createElement('a');a.dataset.n=p[0];a.innerHTML=`<span>${p[1]}</span>${p[0]}`;a.onclick=()=>p[0]=='Logout'?logout():go(p[0]);nav.append(a)})}
function who(n,r){document.getElementById('who').innerHTML=`${n}<br><small style="color:var(--mut)">${r}</small>`}
let role='admin';
const TN=[["My Classes","🏫"],["Attendance","✅"],["Enter Results","📝"],["Assignments","📎"],["Timetable","🗓️"],["Logout","🚪"]];
const PN=[["My Children","👪"],["Child Results","📝"],["Pay Fees","💳"],["Attendance","✅"],["Notices","📣"],["Logout","🚪"]];
const RL={admin:[P,'John Doe','Super Admin','Dashboard','Email address'],student:[ST,'Mary Johnson','Student · SS1A','My Profile','Registration number (STU-0001)'],teacher:[TN,'Mr. David Brown','Teacher · Physics','My Classes','Staff ID (e.g. TCH-012)'],parent:[PN,'Mrs. Johnson','Parent','My Children','Phone number']};
function setRole(r){role=r;lid.placeholder=RL[r][4];['admin','student','teacher','parent'].forEach((k,i)=>document.getElementById('t'+(i+1)).classList.toggle('on',k==r))}
function login(){lg.style.display='none';const c=RL[role];buildNav(c[0]);who(c[1],c[2]);go(c[3])}

function logout(){lg.style.display='flex'}
const kv=r=>r.map(a=>`<div class="act"><small style="flex:1">${a[0]}</small><b>${a[1]}</b></div>`).join('');
const R=[["Mathematics",78],["English",72],["Physics",65],["Biology",81],["Civic Education",88],["Chemistry",59]];
const resT=()=>tbl(["Subject","Score","Grade"],R.map(a=>[a[0],a[1],a[1]>=70?'A':a[1]>=60?'B':'C']));
V.Profile=()=>`${role=='admin'?`<button class="btn" onclick="go('Students')">← Back to Students</button><br><br>`:''}<div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="ic" style="width:72px;height:72px;font-size:34px;background:#2563eb;border-radius:50%">🎓</div><div style="flex:1"><h1 style="margin:0">Mary Johnson</h1><div class="sub" style="margin:0">STU-0001 · SS1A · Session 2026/2027</div></div>${tg('Active')}</div><div class="grid g3" style="margin-top:14px"><div class="card"><h3>Personal Info</h3>${kv([["Gender","Female"],["Date of birth","12 May 2010"],["State","Lagos"],["Admitted","Sep 2024"]])}</div><div class="card"><h3>Guardian</h3>${kv([["Name","Mrs. Johnson"],["Phone","0803 000 0002"],["Relation","Mother"]])}</div><div class="card"><h3>Attendance</h3><b style="font-size:26px">92%</b><div class="prog" style="margin:8px 0"><i style="width:92%"></i></div><small>46 of 50 days present</small></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Latest Results</h3>${resT()}</div><div class="card"><h3>Fees</h3>${kv([["Total","₦105,000"],["Paid","₦70,000"],["Balance","₦35,000"]])}<div class="prog" style="margin-top:10px"><i style="width:67%"></i></div></div></div>`;
V['My Profile']=V.Profile;
V['My Results']=()=>page("My Results","Enter your scratch card details to view results",'',`<div class="card" style="max-width:520px"><form class="f"><label>Term<select><option>First Term 2026/2027</option></select></label><label>Serial Number<input placeholder="SC001"></label><label style="grid-column:1/-1">Scratch Card PIN<input placeholder="Enter PIN"></label></form><br><button class="btn" onclick="res.innerHTML=resT()+'<p>Total: 443 · Average: 73.8 · Position: 4th</p>'">Check Result</button></div><div class="card" id="res" style="margin-top:14px">Your result will appear here.</div>`);
V['Pay Fees']=()=>page("Pay Fees","Outstanding balance for First Term",'',`<div class="grid g2"><div class="card"><h3>Fee Breakdown</h3>${tbl(["Item","Amount","Status"],[["Tuition","₦60,000","Paid"],["Development levy","₦10,000","Paid"],["Books","₦15,000","Pending"],["Transport","₦20,000","Pending"]])}</div><div class="card"><h3>Make Payment</h3><div class="act"><span style="flex:1">Balance</span><b>₦35,000</b></div><br><form class="f"><label style="grid-column:1/-1">Method<select><option>Card</option><option>Bank transfer</option><option>USSD</option></select></label></form><br><button class="btn" onclick="pm.textContent='Demo only: connect Paystack or Flutterwave here.'">Pay ₦35,000</button><p id="pm" style="color:var(--mut)"></p></div></div>`);
const QA={"Add Student":"Add Student","Take Attendance":"Attendance","Create Assignment":"Assignments","Collect Fees":"Fees & Payments","Generate Report":"Reports","Send Notice":"Notices"};
V['Add Student']=()=>page("Add Student","Register a new student",'',`<div class="card"><form class="f"><label>Full name<input></label><label>Date of birth<input type="date"></label><label>Gender<select><option>Female</option><option>Male</option></select></label><label>Class<select><option>JSS1A</option><option>SS1A</option></select></label><label>Guardian name<input></label><label>Guardian phone<input></label></form><br><button class="btn">Save Student</button></div>`);

V['Enter Results']=()=>page("Enter Results","SS1A · Physics · First Term",'Save',`<div class="card">${tbl(["Student","CA (40)","Exam (60)","Total"],S.map((n,i)=>[n,'<input style="width:60px" value="'+(20+i*3)+'">','<input style="width:60px" value="'+(35+i*4)+'">',55+i*7]))}</div>`);
V['My Children']=()=>page("My Children","Tap a child to view their profile",'',`<div class="grid g3">${["Mary Johnson|SS1A","Peter Johnson|JSS2B"].map(c=>{c=c.split('|');return`<div class="card"><h3>${c[0]}</h3><small style="color:var(--mut)">${c[1]}</small><br><br><button class="btn" onclick="go('Profile')">View Profile</button></div>`}).join('')}</div>`);
V['Child Results']=V['My Results'];
const act2=(e)=>`<button class="btn" style="padding:5px 9px" onclick="go('${e}')">Edit</button> <button class="btn" style="padding:5px 9px;background:var(--bad)" onclick="tog(this)">Deactivate</button>`;
function tog(b){const t=b.closest('tr').querySelector('.tag'),on=t.textContent=='Active';t.textContent=on?'Inactive':'Active';t.className='tag '+(on?'t-bad':'t-ok');b.textContent=on?'Activate':'Deactivate';b.style.background=on?'var(--ok)':'var(--bad)'}
const fld=(l,x='')=>`<label>${l}<input ${x}></label>`;
const sel=(l,o)=>`<label>${l}<select>${o.map(a=>`<option>${a}</option>`).join('')}</select></label>`;

V['Add Parent']=()=>page("Add / Edit Parent","Guardian details, children and login",'',`<button class="btn" onclick="go('Parents')">← Back to Parents</button><br><br><div class="card"><form class="f">${fld('Full name')}${fld('Phone (used to log in)')}${fld('Email')}${sel('Relationship',['Mother','Father','Guardian'])}${sel('Link child',S)}${sel('Link another child',['None',...S])}${sel('Create login account',['Yes – generate password','No'])}</form><br><button class="btn" onclick="go('Parents')">Save Parent</button></div>`);
V['Scratch Cards']=()=>page("Scratch Cards","Generate result-checking cards for students",'',`<div class="grid g2"><div class="card"><h3>Generate Cards</h3><form class="f">${sel('Session',['2026/2027'])}${sel('Term',['First','Second','Third'])}${fld('Quantity','id="cq" type="number" value="10"')}${fld('Uses per card','type="number" value="5"')}</form><br><button class="btn" onclick="genCards()">Generate Cards</button><p style="color:var(--mut);font-size:12px">PINs are shown once, so copy or print them straight away.</p></div><div class="card"><h3>Previous Batches</h3>${tbl(["Batch","Term","Cards","Used"],[["B-003","First 2026/27","100","41"],["B-002","Third 2025/26","200","198"],["B-001","Second 2025/26","200","187"]])}</div></div><div class="card" id="cg" style="margin-top:14px">Generated cards will appear here.</div>`);
function genCards(){const n=Math.min(+cq.value||10,50),r=d=>String(Math.floor(Math.random()*10**d)).padStart(d,'0');cg.innerHTML=`<h3>${n} new cards (demo)</h3>`+tbl(["Serial","PIN","Status"],Array.from({length:n},()=>['SC'+r(8),r(4)+'-'+r(4)+'-'+r(4),'Available']))}
buildNav(P);go("Dashboard");
</script></body></html>
