<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Profile – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8" data-student-profile>
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Student Profile</h1>
            <p class="mt-1 text-sm text-muted">View student information and guardian details</p>
          </div>
          <a href="./students.html" class="inline-flex h-10 items-center justify-center rounded-input border border-border bg-card px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
            Back to Students
          </a>
        </div>

        <div id="profile-loading" class="rounded-card border border-border bg-card p-6 text-sm text-muted shadow-sm" role="status" aria-live="polite">
          Loading student profile...
        </div>
        <div id="profile-error" class="hidden rounded-card border border-danger bg-card p-6 text-sm text-danger shadow-sm" role="alert"></div>
        <article id="profile-content" class="hidden rounded-card border border-border bg-card p-6 shadow-sm transition-colors sm:p-8">
          <div class="flex flex-wrap items-start justify-between gap-4 border-b border-border pb-5">
            <div>
              <h2 id="profile-name" class="text-xl font-bold text-text"></h2>
              <p class="mt-1 text-sm text-muted">Student details</p>
            </div>
            <div id="profile-status"></div>
          </div>
          <dl id="profile-details" class="mt-2 grid grid-cols-1 gap-4 sm:grid-cols-2"></dl>
        </article>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-lists.js"></script>
</body>
</html>
