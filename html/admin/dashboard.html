<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section id="admin-content" class="flex-1 px-4 py-5 sm:px-6 lg:px-8" aria-label="Dashboard content"></section>

    <!-- Shared Site Footer Container (Populated via js/footer.js) -->
    <div id="site-footer"></div>
  </main>

  <!-- Shared Footer Script -->
  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
</body>
</html>
