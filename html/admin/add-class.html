<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Class – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="flex-1 px-4 py-5 sm:px-6 lg:px-8">
      <div class="mx-auto w-full max-w-5xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Add Class</h1>
            <p class="mt-1 text-sm text-muted">Create a classroom</p>
          </div>
          <a href="./academics.html" class="inline-flex h-10 items-center justify-center rounded-input border border-border bg-card px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
            Back
          </a>
        </div>

        <div class="rounded-card border border-border bg-card p-6 shadow-sm transition-colors sm:p-9">
          <div id="form-message" class="mb-5 hidden rounded-input border px-4 py-3 text-sm" role="status" aria-live="polite"></div>
          <form id="admin-form" data-form-kind="class" novalidate class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="className" class="mb-1.5 block text-xs font-semibold text-text">Class name <span class="text-danger" aria-hidden="true">*</span></label>
              <input id="className" name="className" type="text" autocomplete="off" required aria-required="true" aria-describedby="className-error" class="w-full rounded-input border border-border bg-bg px-3.5 py-2.5 text-sm text-text placeholder:text-muted/60 transition-colors focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
              <p id="className-error" class="mt-1.5 hidden text-xs font-medium text-danger" role="alert"></p>
            </div>
            <div>
              <label for="arm" class="mb-1.5 block text-xs font-semibold text-text">Arm <span class="text-danger" aria-hidden="true">*</span></label>
              <input id="arm" name="arm" type="text" autocomplete="off" required aria-required="true" aria-describedby="arm-error" class="w-full rounded-input border border-border bg-bg px-3.5 py-2.5 text-sm text-text placeholder:text-muted/60 transition-colors focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
              <p id="arm-error" class="mt-1.5 hidden text-xs font-medium text-danger" role="alert"></p>
            </div>
            <div>
              <label for="formTeacherId" class="mb-1.5 block text-xs font-semibold text-text">Form teacher <span class="text-danger" aria-hidden="true">*</span></label>
              <select id="formTeacherId" name="formTeacherId" required aria-required="true" aria-describedby="formTeacherId-error" class="w-full appearance-none rounded-input border border-border bg-bg px-3.5 py-2.5 text-sm text-text transition-colors focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
                <option value="">Select teacher</option>
              </select>
              <p id="formTeacherId-error" class="mt-1.5 hidden text-xs font-medium text-danger" role="alert"></p>
            </div>
            <div>
              <label for="session" class="mb-1.5 block text-xs font-semibold text-text">Session <span class="text-danger" aria-hidden="true">*</span></label>
              <input id="session" name="session" type="text" autocomplete="off" placeholder="2026/2027" required aria-required="true" aria-describedby="session-error" class="w-full rounded-input border border-border bg-bg px-3.5 py-2.5 text-sm text-text placeholder:text-muted/60 transition-colors focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
              <p id="session-error" class="mt-1.5 hidden text-xs font-medium text-danger" role="alert"></p>
            </div>
            <div class="flex flex-wrap items-center justify-end gap-3 border-t border-border pt-5" style="grid-column: 1 / -1;">
              <a href="./academics.html" class="inline-flex min-h-10 items-center justify-center rounded-input px-4 py-2 text-sm font-semibold text-muted transition-colors hover:bg-bg hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Cancel</a>
              <button type="submit" class="inline-flex h-10 items-center justify-center rounded-input bg-primary px-5 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-wait disabled:opacity-75">
                Save Class
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-academics.js"></script>
</body>
</html>
