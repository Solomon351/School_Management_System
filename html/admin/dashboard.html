<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section id="admin-content" class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8" aria-label="Dashboard content">
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-6">
          <h1 class="text-2xl font-bold tracking-tight text-text">Dashboard</h1>
          <p class="mt-1 text-sm text-muted">An overview of your school</p>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <article class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h2 class="text-sm font-medium text-muted">Total Students</h2>
                <p class="mt-2 text-3xl font-bold tracking-tight text-text" data-dashboard-stat="students">—</p>
              </div>
              <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-input bg-primary/10 text-primary" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v6M22 11h-6"/></svg>
              </span>
            </div>
          </article>
          <article class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h2 class="text-sm font-medium text-muted">Total Teachers</h2>
                <p class="mt-2 text-3xl font-bold tracking-tight text-text" data-dashboard-stat="teachers">—</p>
              </div>
              <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-input bg-primary/10 text-primary" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 5-10 5L2 8l10-5Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg>
              </span>
            </div>
          </article>
          <article class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h2 class="text-sm font-medium text-muted">Total Parents</h2>
                <p class="mt-2 text-3xl font-bold tracking-tight text-text" data-dashboard-stat="parents">—</p>
              </div>
              <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-input bg-primary/10 text-primary" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v6M22 11h-6"/></svg>
              </span>
            </div>
          </article>
          <article class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h2 class="text-sm font-medium text-muted">Total Classes</h2>
                <p class="mt-2 text-3xl font-bold tracking-tight text-text" data-dashboard-stat="classes">—</p>
              </div>
              <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-input bg-primary/10 text-primary" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7 12 2l10 5-10 5L2 7Z"/><path d="M6 9v6c3.5 3 8.5 3 12 0V9M22 7v7"/></svg>
              </span>
            </div>
          </article>
        </div>

        <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
          <section class="rounded-card border border-border bg-card shadow-sm transition-colors lg:col-span-2" aria-labelledby="recent-activity-heading">
            <div class="border-b border-border px-5 py-4">
              <h2 id="recent-activity-heading" class="text-base font-semibold text-text">Recent activity</h2>
            </div>
            <div class="p-5">
              <p data-dashboard-activity-empty class="text-sm text-muted">Recent activity will appear here.</p>
              <ul data-dashboard-activity class="hidden divide-y divide-border"></ul>
            </div>
          </section>

          <section class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors" aria-labelledby="quick-actions-heading">
            <h2 id="quick-actions-heading" class="text-base font-semibold text-text">Quick actions</h2>
            <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-1">
              <a href="./add-student.html" class="inline-flex min-h-11 items-center justify-center rounded-input bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Add Student</a>
              <a href="./add-teacher.html" class="inline-flex min-h-11 items-center justify-center rounded-input border border-border bg-bg px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Add Teacher</a>
              <a href="./add-parent.html" class="inline-flex min-h-11 items-center justify-center rounded-input border border-border bg-bg px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Add Parent</a>
              <a href="./add-class.html" class="inline-flex min-h-11 items-center justify-center rounded-input border border-border bg-bg px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Add Class</a>
            </div>
          </section>
        </div>
      </div>
    </section>

    <!-- Shared Site Footer Container (Populated via js/footer.js) -->
    <div id="site-footer"></div>
  </main>

  <!-- Shared Footer Script -->
  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-dashboard.js"></script>
</body>
</html>
