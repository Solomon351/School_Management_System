<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Teacher Profile – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8" data-teacher-profile>
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Teacher Profile</h1>
            <p class="mt-1 text-sm text-muted">View teacher information and teaching details</p>
          </div>
          <a href="./teachers.html" class="inline-flex h-10 items-center justify-center rounded-input border border-border bg-card px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
            Back to Teachers
          </a>
        </div>

        <div id="teacher-profile-loading" class="rounded-card border border-border bg-card p-6 text-sm text-muted shadow-sm" role="status" aria-live="polite">
          Loading teacher profile...
        </div>
        <div id="teacher-profile-error" class="hidden rounded-card border border-danger bg-card p-6 text-sm text-danger shadow-sm" role="alert"></div>
        <div id="teacher-profile-empty" class="hidden rounded-card border border-border bg-card p-6 text-sm text-muted shadow-sm" role="status" aria-live="polite">
          No teacher profile is selected. Open a teacher from the Teachers list to view their details.
        </div>

        <div id="teacher-profile-content" class="hidden space-y-4 anim-fade-up">
          <article class="rounded-card border border-border bg-card p-5 shadow-sm transition-colors sm:p-6">
            <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
              <div id="teacher-profile-initials" class="flex h-20 w-20 shrink-0 items-center justify-center rounded-full bg-primary/10 text-2xl font-bold text-primary" aria-hidden="true"></div>
              <div class="min-w-0 flex-1">
                <h2 id="teacher-profile-name" class="break-words text-xl font-bold text-text"></h2>
                <p class="mt-1 text-sm text-muted">Staff ID: <span id="teacher-profile-staff-id"></span></p>
                <div id="teacher-profile-status" class="mt-3"></div>
              </div>
              <div class="flex flex-wrap gap-2">
                <a id="teacher-profile-edit" href="./add-teacher.html" class="inline-flex h-10 items-center justify-center rounded-input border border-border bg-card px-4 py-2 text-sm font-semibold text-text transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
                  Edit
                </a>
                <button id="teacher-profile-status-button" type="button" class="inline-flex h-10 items-center justify-center rounded-input px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2">
                  Deactivate
                </button>
              </div>
            </div>
          </article>

          <div class="grid min-w-0 gap-4 md:grid-cols-2">
            <section class="min-w-0 rounded-card border border-border bg-card p-5 shadow-sm transition-colors sm:p-6" aria-labelledby="teacher-contact-heading">
              <h3 id="teacher-contact-heading" class="mb-3 text-base font-semibold text-text">Contact Details</h3>
              <dl id="teacher-contact-details" class="divide-y divide-border"></dl>
            </section>
            <section class="min-w-0 rounded-card border border-border bg-card p-5 shadow-sm transition-colors sm:p-6" aria-labelledby="teacher-teaching-heading">
              <h3 id="teacher-teaching-heading" class="mb-3 text-base font-semibold text-text">Teaching Details</h3>
              <dl id="teacher-teaching-details" class="divide-y divide-border"></dl>
            </section>
          </div>
        </div>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-teacher-profile.js"></script>
</body>
</html>
