<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Academics – Educanize School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen bg-bg font-sans text-text antialiased transition-colors">
  <div id="admin-sidebar"></div>

  <main class="flex min-h-screen min-w-0 flex-1 flex-col">
    <div id="admin-header"></div>
    <section class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8" data-academics-page>
      <div class="mx-auto w-full max-w-7xl">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-text">Academics</h1>
            <p class="mt-1 text-sm text-muted">Classes and subjects</p>
          </div>
        </div>

        <div class="overflow-hidden rounded-card border border-border bg-card shadow-sm transition-colors">
          <div class="flex flex-col gap-3 border-b border-border p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
            <div class="inline-flex rounded-input border border-border bg-bg p-1" role="tablist" aria-label="Academics tabs">
              <button type="button" data-tab="classes" role="tab" aria-selected="true" class="rounded-input px-4 py-2 text-sm font-semibold text-white bg-primary shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Classes</button>
              <button type="button" data-tab="subjects" role="tab" aria-selected="false" class="rounded-input px-4 py-2 text-sm font-semibold text-muted hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Subjects</button>
            </div>
            <a id="add-resource-button" href="./add-class.html" class="inline-flex h-10 items-center justify-center rounded-input bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
              Add Class
            </a>
          </div>

          <div class="flex flex-col gap-3 border-b border-border bg-bg/30 p-4 sm:flex-row sm:items-center sm:justify-between">
            <label class="block w-full sm:max-w-sm">
              <span class="sr-only">Search academics</span>
              <input id="list-search" type="search" placeholder="Search..." aria-label="Search academics"
                class="h-10 w-full rounded-input border border-border bg-bg px-3.5 text-sm text-text placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
            </label>
            <label class="flex items-center gap-2 text-sm text-muted">
              <span>Status</span>
              <select id="list-status" aria-label="Filter academic records by status" class="h-10 min-w-32 rounded-input border border-border bg-bg px-3 text-sm text-text focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </label>
          </div>

          <div class="p-5 text-sm text-muted" id="list-loading" role="status" aria-live="polite">Loading academics...</div>
          <div class="hidden p-5 text-sm text-danger" id="list-error" role="alert"></div>
          <div class="hidden p-5 text-sm text-muted" id="list-empty" role="status"></div>

          <div id="classes-panel" class="panel">
            <div class="hidden min-w-0" id="classes-table">
              <div class="max-w-full overflow-x-auto">
                <table class="w-full min-w-[900px] border-collapse text-left">
                  <caption class="sr-only">Classes</caption>
                  <thead class="bg-bg text-xs font-semibold uppercase tracking-wide text-muted">
                    <tr>
                      <th scope="col" class="px-4 py-3">Class</th>
                      <th scope="col" class="px-4 py-3">Form teacher</th>
                      <th scope="col" class="px-4 py-3">Students</th>
                      <th scope="col" class="px-4 py-3">Subjects</th>
                      <th scope="col" class="px-4 py-3">Status</th>
                      <th scope="col" class="px-4 py-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="classes-rows"></tbody>
                </table>
              </div>
              <div id="classes-pagination" class="hidden flex-col gap-3 border-t border-border px-4 py-3 text-sm text-muted sm:flex-row sm:items-center sm:justify-between">
                <p id="classes-page-info" aria-live="polite"></p>
                <div class="flex gap-2">
                  <button id="classes-previous" type="button" class="rounded-input border border-border px-3 py-2 font-medium text-text hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50">Previous</button>
                  <button id="classes-next" type="button" class="rounded-input border border-border px-3 py-2 font-medium text-text hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50">Next</button>
                </div>
              </div>
            </div>
          </div>

          <div id="subjects-panel" class="panel hidden">
            <div class="hidden min-w-0" id="subjects-table">
              <div class="max-w-full overflow-x-auto">
                <table class="w-full min-w-[900px] border-collapse text-left">
                  <caption class="sr-only">Subjects</caption>
                  <thead class="bg-bg text-xs font-semibold uppercase tracking-wide text-muted">
                    <tr>
                      <th scope="col" class="px-4 py-3">Code</th>
                      <th scope="col" class="px-4 py-3">Subject</th>
                      <th scope="col" class="px-4 py-3">Classes</th>
                      <th scope="col" class="px-4 py-3">Teacher</th>
                      <th scope="col" class="px-4 py-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="subjects-rows"></tbody>
                </table>
              </div>
              <div id="subjects-pagination" class="hidden flex-col gap-3 border-t border-border px-4 py-3 text-sm text-muted sm:flex-row sm:items-center sm:justify-between">
                <p id="subjects-page-info" aria-live="polite"></p>
                <div class="flex gap-2">
                  <button id="subjects-previous" type="button" class="rounded-input border border-border px-3 py-2 font-medium text-text hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50">Previous</button>
                  <button id="subjects-next" type="button" class="rounded-input border border-border px-3 py-2 font-medium text-text hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50">Next</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="site-footer"></div>
  </main>

  <script src="../../js/footer.js"></script>
  <script src="../../js/admin-layout.js"></script>
  <script src="../../js/admin-academics.js"></script>
</body>
</html>
